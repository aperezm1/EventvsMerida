<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-inner">
    <button class="nav-logo" (click)="scrollToTop()">
      <img [src]="logoUrl" [alt]="logoAltKey | translate" class="logo-img" />
    </button>

    <ul class="nav-links">
      @for (item of navItems; track item.sectionId) {
        <li>
          <button (click)="scrollTo(item.sectionId)" [class.nav-cta]="item.cta">
            {{ item.labelKey | translate }}
          </button>
        </li>
      }
    </ul>

    <div class="nav-controls">
      <select
        class="language-select"
        [attr.aria-label]="languageSelectorLabelKey | translate"
        [value]="currentLanguage()"
        (change)="changeLanguageFromSelect($event)"
      >
        @for (language of languages; track language.code) {
          <option [value]="language.code">
            {{ language.labelKey | translate }}
          </option>
        }
      </select>

      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="menuOpen()">
    @for (item of mobileNavItems; track item.sectionId) {
      <button (click)="scrollToAndClose(item.sectionId)">
        {{ item.labelKey | translate }}
      </button>
    }

    <div class="mobile-language-wrap">
      <select
        class="language-select mobile-language-select"
        [attr.aria-label]="languageSelectorLabelKey | translate"
        [value]="currentLanguage()"
        (change)="changeLanguageFromSelect($event, true)"
      >
        @for (language of languages; track language.code) {
          <option [value]="language.code">
            {{ language.labelKey | translate }}
          </option>
        }
      </select>
    </div>
  </div>
</nav>
